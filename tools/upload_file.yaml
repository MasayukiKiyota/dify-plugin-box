identity:
  name: upload_file
  author: masayukikiyota
  label:
    en_US: Upload File
    zh_Hans: 上传文件
    pt_BR: Enviar Arquivo
    ja_JP: ファイルアップロード
    zh_Hant: 上傳檔案
description:
  human:
    en_US: Upload a file to Box
    zh_Hans: 将文件上传到 Box
    pt_BR: Enviar um arquivo para o Box
    ja_JP: Box にファイルをアップロードします
    zh_Hant: 將檔案上傳至 Box
  llm: Uploads a new file to a Box folder. Provide the file name and either text content directly or binary content as a base64-encoded string. The file is created inside the folder given by parent_folder_id (root folder "0" if omitted). Returns information about the uploaded file including its new ID.
parameters:
  - name: file_name
    type: string
    required: true
    label:
      en_US: File Name
      zh_Hans: 文件名
      pt_BR: Nome do Arquivo
      ja_JP: ファイル名
      zh_Hant: 檔案名稱
    human_description:
      en_US: The name to give the uploaded file (including extension)
      zh_Hans: 上传文件的名称（包含扩展名）
      pt_BR: O nome do arquivo enviado (incluindo a extensão)
      ja_JP: アップロードするファイルの名前（拡張子を含む）
      zh_Hant: 上傳檔案的名稱（含副檔名）
    llm_description: The name for the new file in Box, including its extension, e.g. 'report.txt' or 'image.jpg'.
    form: llm
  - name: parent_folder_id
    type: string
    required: false
    label:
      en_US: Parent Folder ID
      zh_Hans: 父文件夹 ID
      pt_BR: ID da Pasta Pai
      ja_JP: 親フォルダ ID
      zh_Hant: 上層資料夾 ID
    human_description:
      en_US: The ID of the folder to upload into (leave empty for the root folder)
      zh_Hans: 要上传到的文件夹 ID（留空表示根目录）
      pt_BR: O ID da pasta de destino (deixe vazio para a raiz)
      ja_JP: アップロード先フォルダの ID（ルートの場合は空のままにします）
      zh_Hant: 欲上傳到的資料夾 ID（留空代表根目錄）
    llm_description: The Box folder ID where the file will be uploaded. Box uses numeric IDs, not paths. The root folder is always "0". Leave empty to upload to the root folder.
    form: llm
  - name: file_content
    type: string
    required: false
    label:
      en_US: File Content
      zh_Hans: 文件内容
      pt_BR: Conteúdo do Arquivo
      ja_JP: ファイル内容
      zh_Hant: 檔案內容
    human_description:
      en_US: The text content to save (for text files)
      zh_Hans: 要保存的文本内容（用于文本文件）
      pt_BR: O conteúdo de texto a ser salvo (para arquivos de texto)
      ja_JP: 保存するテキスト内容（テキストファイル用）
      zh_Hant: 要儲存的文字內容（適用於文字檔）
    llm_description: The text content to store in the file. Use this for text files. Either file_content or file_content_base64 must be provided.
    form: llm
  - name: file_content_base64
    type: string
    required: false
    label:
      en_US: File Content (Base64)
      zh_Hans: 文件内容（Base64）
      pt_BR: Conteúdo do Arquivo (Base64)
      ja_JP: ファイル内容（Base64）
      zh_Hant: 檔案內容（Base64）
    human_description:
      en_US: The base64-encoded content (for binary files)
      zh_Hans: Base64 编码的内容（用于二进制文件）
      pt_BR: O conteúdo codificado em base64 (para arquivos binários)
      ja_JP: Base64 エンコードされた内容（バイナリファイル用）
      zh_Hant: Base64 編碼的內容（適用於二進位檔）
    llm_description: Base64-encoded content for the file. Use this for binary files like images or documents. Either file_content or file_content_base64 must be provided.
    form: llm
extra:
  python:
    source: tools/upload_file.py
